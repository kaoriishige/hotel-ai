<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>メール配信停止手続き | 那須町サウナ・水風呂 那須ユートピア美野沢</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body {
      background-color: #04111d;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 520px;
      width: 90%;
      margin: 40px auto;
    }
    .card {
      background: #0b1d33;
      border: 1px solid #1e3a5f;
      border-radius: 16px;
      padding: 36px 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    .status-icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: inline-block;
    }
    .status-icon.success { color: #34d399; }
    .status-icon.loading { color: #60a5fa; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    h2 { font-size: 20px; color: #fff; margin-top: 0; margin-bottom: 12px; }
    .target-badge {
      display: inline-block;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: #93c5fd;
      margin-bottom: 20px;
      word-break: break-all;
    }
    p { font-size: 14px; color: #94a3b8; line-height: 1.8; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      background: rgba(255,255,255,0.1);
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }
    .btn:hover { background: rgba(255,255,255,0.18); }
    .input-field {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      background: #04111d;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div style="font-size: 11px; letter-spacing: 2px; color: #64748b; margin-bottom: 12px; font-weight: bold;">AKASAWA ONSEN RYOKAN</div>
      
      <div id="loadingState">
        <div class="status-icon loading">🔄</div>
        <h2>配信停止手続きを行っています...</h2>
        <p>少々お待ちください。</p>
      </div>

      <div id="successState" style="display: none;">
        <div class="status-icon success">✓</div>
        <h2>配信停止を受け付けました</h2>
        <div id="targetEmailDisplay" class="target-badge"></div>
        <p>
          那須町サウナ・水風呂 那須ユートピア美野沢からのメール配信停止手続きが完了いたしました。<br>
          今後、本アドレスへのメール配信は行われません。<br>
          これまでのご愛読、誠にありがとうございました。
        </p>
        <button onclick="window.close();" class="btn">閉じる</button>
      </div>

      <div id="manualState" style="display: none;">
        <div class="status-icon" style="color: #f59e0b;">✉️</div>
        <h2>メール配信停止のお手続き</h2>
        <p>配信停止をご希望のメールアドレスを入力してください。</p>
        <form id="manualForm" onsubmit="handleManualSubmit(event)">
          <input type="email" id="manualEmailInput" class="input-field" placeholder="example@email.com" required />
          <button type="submit" class="btn" style="background: #ef4444; border-color: #dc2626; color: #fff; font-weight: bold; width: 100%;">配信を停止する</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email') || '';
    const cid = params.get('cid') || '';

    async function executeUnsubscribe(targetEmail, targetCid) {
      try {
        const res = await fetch('/api/unsubscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: targetEmail, cid: targetCid })
        });
        const data = await res.json();
        
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('manualState').style.display = 'none';
        document.getElementById('successState').style.display = 'block';
        
        const label = targetEmail || `顧客識別ID: ${targetCid}`;
        document.getElementById('targetEmailDisplay').textContent = label;
      } catch (err) {
        console.error('Unsubscribe error:', err);
        showManualForm(targetEmail);
      }
    }

    function showManualForm(defaultEmail) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('successState').style.display = 'none';
      document.getElementById('manualState').style.display = 'block';
      if (defaultEmail) {
        document.getElementById('manualEmailInput').value = defaultEmail;
      }
    }

    function handleManualSubmit(e) {
      e.preventDefault();
      const val = document.getElementById('manualEmailInput').value.trim();
      if (!val) return;
      document.getElementById('manualState').style.display = 'none';
      document.getElementById('loadingState').style.display = 'block';
      executeUnsubscribe(val, '');
    }

    if (email || cid) {
      executeUnsubscribe(email, cid);
    } else {
      showManualForm('');
    }
  </script>
</body>
</html>
