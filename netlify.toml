[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "googleapis"]

[[redirects]]
  from = "/akasawa"
  to = "/akasawa/index.html"
  status = 200

[[redirects]]
  from = "/akasawa/*"
  to = "/akasawa/index.html"
  status = 200

