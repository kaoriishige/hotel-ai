[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "googleapis"]

# 那須ユートピア美野沢 サブアプリ群 (200 OK パスフォワード)
[[redirects]]
  from = "/nasu-utopia-chat/*"
  to = "/nasu-utopia-chat/:splat"
  status = 200

[[redirects]]
  from = "/nasu-utopia-ml/*"
  to = "/nasu-utopia-ml/:splat"
  status = 200

