[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "googleapis"]

# 那須ユートピア美野沢 ダイナミックプライシング (React SPA ルーティング)
[[redirects]]
  from = "/nasu-utopia/dp"
  to = "/nasu-utopia/dp/index.html"
  status = 200

[[redirects]]
  from = "/nasu-utopia/dp/*"
  to = "/nasu-utopia/dp/index.html"
  status = 200

# 赤沢温泉旅館 ダイナミックプライシング (React SPA ルーティング)
[[redirects]]
  from = "/akasawa/dp"
  to = "/akasawa/dp/index.html"
  status = 200

[[redirects]]
  from = "/akasawa/dp/*"
  to = "/akasawa/dp/index.html"
  status = 200

[[redirects]]
  from = "/akasawa-dp"
  to = "/akasawa-dp/index.html"
  status = 200

[[redirects]]
  from = "/akasawa-dp/*"
  to = "/akasawa-dp/index.html"
  status = 200

# 遠藤正俊オーナー ショート動画・SNS配信システム ルーティング
[[redirects]]
  from = "/endo-sns"
  to = "/endo-sns/index.html"
  status = 200

[[redirects]]
  from = "/endo-sns/*"
  to = "/endo-sns/:splat"
  status = 200

# 施設別ポータルダッシュボード ルーティング
[[redirects]]
  from = "/akasawa"
  to = "/akasawa/index.html"
  status = 200

[[redirects]]
  from = "/nasu-utopia"
  to = "/nasu-utopia/index.html"
  status = 200

